name: DTAP Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and Test with Maven
        run: mvn clean verify

      - name: Generate JAR version
        id: jar_version
        run: echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 30

  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: ./artifact

      - name: Deploy to Development
        run: echo "Deploying JAR version ${{ needs.build.outputs.jar_version }} to DEV"

  deploy-test:
    if: github.ref == 'refs/heads/develop'
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: ./artifact

      - name: Deploy to Test
        run: |
          echo "Deploying JAR version ${{ needs.build.outputs.jar_version }} to TEST"

  deploy-acceptance:
    if: github.ref == 'refs/heads/develop'
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: acceptance

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: ./artifact

      - name: Deploy to Acceptance
        run: echo "Deploying JAR version ${{ needs.build.outputs.jar_version }} to ACCEPTANCE"

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: ./artifact

      - name: Deploy to Production
        run: echo "Deploying JAR version ${{ needs.build.outputs.jar_version }} to PRODUCTION"